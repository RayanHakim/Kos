<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/room.css">
    <link rel="stylesheet" href="css/ui.css">
</head>

<body>

    <main id="game">

        <!-- TOP UI -->
        <header class="hud">
            <div class="logo">KOS</div>

            <div class="clock">
                <span id="time">08:00</span>
                <span id="day">Monday</span>
            </div>
        </header>


        <!-- ROOM -->
        <section id="room-container">

            <svg
                id="room"
                viewBox="0 0 1000 700"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- ROOM -->
                <g id="room-background">
                    <!-- floor -->
                    <polygon
                        class="floor"
                        points="150,180 750,180 900,350 300,350"
                    />

                    <!-- back wall -->
                    <polygon
                        class="wall"
                        points="150,180 750,180 750,20 150,20"
                    />

                    <!-- side wall -->
                    <polygon
                        class="wall side"
                        points="750,180 900,350 900,190 750,20"
                    />
                </g>


                <!-- WINDOW -->
                <g
                    id="window"
                    class="object interactive"
                    data-object="window"
                >
                    <rect
                        x="350"
                        y="60"
                        width="180"
                        height="100"
                    />
                </g>


                <!-- WARDROBE -->
                <g
                    id="wardrobe"
                    class="object interactive"
                    data-object="wardrobe"
                >
                    <rect
                        x="600"
                        y="100"
                        width="100"
                        height="160"
                    />
                </g>


                <!-- BED -->
                <g
                    id="bed"
                    class="object interactive"
                    data-object="bed"
                >
                    <polygon
                        points="260,260 470,260 560,310 350,310"
                    />

                    <polygon
                        points="260,260 350,210 560,260 470,310"
                    />
                </g>


                <!-- DESK -->
                <g
                    id="desk"
                    class="object interactive"
                    data-object="desk"
                >
                    <polygon
                        points="560,280 680,280 750,320 630,320"
                    />
                </g>


                <!-- LAPTOP -->
                <g
                    id="laptop"
                    class="object interactive"
                    data-object="laptop"
                >
                    <rect
                        x="600"
                        y="255"
                        width="70"
                        height="45"
                    />
                </g>


                <!-- SUITCASE -->
                <g
                    id="suitcase"
                    class="object interactive"
                    data-object="suitcase"
                >
                    <rect
                        x="470"
                        y="330"
                        width="80"
                        height="50"
                    />
                </g>

            </svg>

        </section>


        <!-- INTERACTION POPUP -->
        <div id="interaction-panel" class="hidden">

            <button id="close-panel">
                ×
            </button>

            <h2 id="panel-title">
                Object
            </h2>

            <div id="panel-content"></div>

        </div>


        <!-- TOOLTIP -->
        <div id="tooltip"></div>


    </main>

    <script src="js/main.js"></script>
    <script src="js/room.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/time.js"></script>
    <script src="js/save.js"></script>

</body>
</html>
